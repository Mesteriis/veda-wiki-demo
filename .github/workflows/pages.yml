# Publishes this repository to GitHub Pages with VEDA's Markdown rendering.
# Enable it in Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pin a VEDA commit or tag; main follows the latest rules.
  VEDA_VERSION: a1fb1f11bf3b54214e87813668d4852cdfa55a82

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install "github.com/Mesteriis/veda-wiki/cmd/veda-site@${VEDA_VERSION}"
      # --strict fails the build on formatting warnings, as VEDA reports them.
      - run: veda-site --strict . "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
